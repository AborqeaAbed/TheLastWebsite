server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/thelastwebsite}
    username: ${DB_USERNAME:${USER:postgres}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  
  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false


cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

resend:
  # TODO: rotate and inject via a secrets manager (e.g. HashiCorp Vault, AWS Secrets Manager, or GCP Secret Manager)
  # Never hardcode secrets here — set RESEND_API_KEY in the environment or a local .env file (not committed).
  api-key: ${RESEND_API_KEY}

email:
  from: ${EMAIL_FROM:onboarding@resend.dev}
  magic-link-base-url: ${MAGIC_LINK_BASE_URL:http://localhost:3000}

admin:
  token: ${ADMIN_TOKEN:dev-admin-token}

payment:
  success-url: ${PAYMENT_SUCCESS_URL:http://localhost:3000/verify}
  cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:3000/?canceled=1}

logging:
  level:
    com.thelastwebsite: DEBUG